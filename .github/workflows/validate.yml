name: Validate research package
on:
  push:
  pull_request:
jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_package.py
      - name: Archive only this repository
        run: git archive --format=zip --output="$RUNNER_TEMP/rules-source.zip" HEAD
      - name: Run shortest Skill workflow in isolated directory and venv
        run: python scripts/verify_standalone.py --archive "$RUNNER_TEMP/rules-source.zip" --output-dir "$RUNNER_TEMP/rules-independent"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-receipt-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/rules-independent/receipt.json
            ${{ runner.temp }}/rules-independent/scenarios/
